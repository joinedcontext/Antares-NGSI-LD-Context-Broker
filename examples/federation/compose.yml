services:
  broker-a:
    image: ghcr.io/joinedcontext/antares-broker:dev
    ports: ["9090:9090"]
    environment:
      ANTARES_HOST_ALIAS: broker-a
      ANTARES_EGRESS_ALLOW_PRIVATE: "true"   # demo network — see the federation guide
  broker-b:
    image: ghcr.io/joinedcontext/antares-broker:dev
    ports: ["9091:9090"]
    environment:
      ANTARES_HOST_ALIAS: broker-b
      ANTARES_EGRESS_ALLOW_PRIVATE: "true"
