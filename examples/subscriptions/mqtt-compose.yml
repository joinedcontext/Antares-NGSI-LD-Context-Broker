# MQTT variant: broker + mosquitto. Subscribe with an mqtt:// endpoint and
# watch with mosquitto_sub — validated by the examples CI job (MQTT needs
# the mosquitto container; the HTTP variant in run.sh is the local path).
services:
  broker:
    image: ghcr.io/joinedcontext/antares-broker:dev
    ports: ["9090:9090"]
    # demo network: the broker notifies mosquitto by service name, which
    # is a private address. Never set this facing the internet (SSRF guard).
    environment: {ANTARES_EGRESS_ALLOW_PRIVATE: "true"}
  mosquitto:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports: ["1883:1883"]
