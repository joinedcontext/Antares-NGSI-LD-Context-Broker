# kind/CI smoke ONLY: one PostGIS pod, no HA, no failover — the real shape is
# postgres-cnpg.yaml. Recreate on purpose: two postgres pods on one PVC would
# corrupt. The credentials here are throwaway; nothing outside a kind cluster
# reads this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-dev-init
  namespace: antares
data:
  # The official entrypoint runs this once, as the superuser, before the
  # server accepts outside connections.
  10-antares-app.sql: |
    -- The broker connects as this role, which is deliberately neither a
    -- superuser nor BYPASSRLS: ANTARES_REQUIRE_RLS=1 refuses to boot on a
    -- role that escapes the tenant-isolation policies, and the migration
    -- marks every tenant table FORCE ROW LEVEL SECURITY so the owner obeys
    -- them too.
    CREATE ROLE antares_app LOGIN PASSWORD 'antares_app';
    GRANT ALL ON DATABASE antares TO antares_app;
    GRANT ALL ON SCHEMA public TO antares_app;
    -- postgis and btree_gin are not trusted extensions, so only a superuser
    -- can install them. Installed here, the migration's own
    -- CREATE EXTENSION IF NOT EXISTS finds them present and skips, which a
    -- non-superuser is allowed to do.
    CREATE EXTENSION IF NOT EXISTS postgis;
    CREATE EXTENSION IF NOT EXISTS btree_gin;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: antares
spec:
  selector: { app: postgres-dev }
  ports:
    - { port: 5432 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-dev
  namespace: antares
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres-dev }
  template:
    metadata:
      labels: { app: postgres-dev }
    spec:
      # Started directly as the image's own postgres uid: as root the
      # entrypoint chowns PGDATA and drops privileges, which needs the
      # capabilities dropped below, and refuses to start without them. PGDATA
      # is inside the image and world-writable, so as uid 999 the entrypoint
      # skips that path. The root filesystem stays writable — the server
      # writes PGDATA, its socket and its logs there.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: ghcr.io/baosystems/postgis:17-3.5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          env:
            - { name: POSTGRES_USER, value: antares }
            - { name: POSTGRES_PASSWORD, value: antares }
            - { name: POSTGRES_DB, value: antares }
          ports:
            - { containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "antares"]
            periodSeconds: 5
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1Gi }
      volumes:
        - name: init
          configMap: { name: postgres-dev-init }
