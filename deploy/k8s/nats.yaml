# 3-node JetStream cluster: R3 stream replication set by the BROKER
# (ANTARES_NATS_REPLICAS=3 — stream replication is a client-side setting).
# Memory-light by design (~100 MB/node at target scale); limits per R1/R2.
#
# The server here requires no client authentication and speaks plaintext:
# the change stream carries every tenant's events, so what keeps it internal
# is networkpolicy.yaml (only pods labelled `app: antares` reach 4222) plus
# the namespace boundary. A cluster that does not treat its pod network as
# trusted adds nkey/creds or mTLS to this StatefulSet and points
# ANTARES_NATS_URL at it — the broker logs a warning on every connection to
# a server that requires no authentication.
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: antares
  labels: { app: nats }
spec:
  clusterIP: None # headless: stable per-pod DNS for the cluster routes
  selector: { app: nats }
  ports:
    - { name: client, port: 4222 }
    - { name: cluster, port: 6222 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: antares
spec:
  serviceName: nats
  replicas: 3
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      # The image declares no USER, so the uid is pinned here; nats-server
      # needs no privileges and writes only to the volumeClaimTemplate, which
      # fsGroup makes writable for that uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nats
          image: nats:2-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          args:
            - "-js"
            - "--name=$(POD_NAME)"
            - "--cluster_name=antares"
            - "--cluster=nats://0.0.0.0:6222"
            - "--routes=nats://nats-0.nats.antares.svc:6222,nats://nats-1.nats.antares.svc:6222,nats://nats-2.nats.antares.svc:6222"
            - "--store_dir=/data"
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports:
            - { containerPort: 4222, name: client }
            - { containerPort: 6222, name: cluster }
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
