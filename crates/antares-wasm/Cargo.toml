[package]
name = "antares-wasm"
description = "The Antares broker compiled to WebAssembly: the same router, fed by a Service Worker instead of a TCP listener."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The memory store through the same seam; `postgres` off — sqlx needs sockets.
# (workspace decls are default-features=false; NOTHING re-enables them here.)
antares-api = { workspace = true }
antares-sql = { workspace = true }
antares-jsonld = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
# `now_or_never`: the JS constructors cannot await the wiring's memory-arm
# futures, which complete on their first poll.
futures-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }

# default axum minus "http1"+"tokio": the router without the listener.
axum = { version = "0.8", default-features = false, features = [
    "form", "json", "matched-path", "original-uri", "query", "tower-log", "tracing",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# uuid v4 needs a randomness source the target cannot autodetect: `js` routes
# it to crypto.getRandomValues via wasm-bindgen (feature unification applies
# it to every uuid user in this build).
uuid = { workspace = true, features = ["js"] }
# redb over the OPFS StorageBackend (src/opfs.rs)
redb = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
gloo-timers = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "ResponseInit",
    # OPFS surface (dedicated-worker sync access handles)
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
    "StorageManager",
    "WorkerGlobalScope",
    "WorkerNavigator",
] }
console_error_panic_hook = { workspace = true }
send_wrapper = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# Tests need a real TCP listener feeding the SAME broker instance — the
# native stand-in for the browser loopback host (tests/handle.rs).
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true }

[lints]
workspace = true
