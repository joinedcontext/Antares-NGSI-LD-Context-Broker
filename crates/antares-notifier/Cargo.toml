[package]
name = "antares-notifier"
description = "Notification delivery: NotificationSink trait keyed by endpoint.uri scheme; http sink; mqtt behind feature."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

[dependencies]
antares-model = { workspace = true }
antares-jsonld = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rumqttc = { workspace = true, optional = true }
# the crypto provider for mqtts; the provider choice and why it is pinned
# there is documented at the workspace declaration
rustls = { workspace = true, optional = true }

[features]
default = ["mqtt"]
mqtt = ["dep:rumqttc", "dep:rustls"]

[lints]
workspace = true

# Same crates, target-appropriate backends (sockets + rustls natively, the
# browser's own fetch/timers on wasm32). Target sections only — no logic
# differs between them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros"] }

[package.metadata.cargo-machete]
# rustls appears unused because no code names it: it exists to force the
# `ring` provider feature into the graph for rumqttc's provider-less TLS.
ignored = ["rustls"]
