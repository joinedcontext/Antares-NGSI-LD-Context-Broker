[package]
name = "antares-sql"
description = "AST -> SQL compiler + schema migrations, plus the sqlx store implementations."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = { workspace = true }
antares-model = { workspace = true }
antares-store = { workspace = true }
antares-ql = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
redb = { workspace = true }
sqlx = { workspace = true, optional = true }
# the Postgres arm's pool-pressure histogram; a facade with no recorder
# installed (telemetry off, or a test) compiles to a no-op
metrics = { workspace = true, optional = true }
futures-util = { workspace = true }
tracing = { workspace = true }

# tokio carries sockets natively; on wasm32 only the sync primitives —
# the on_blocking helper compiles to a plain inline call there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }

[dev-dependencies]
# The driver contract kit: the backends in this crate are held to it.
antares-store = { workspace = true, features = ["test-kit"] }
# This crate again, with `test-kit` on: the row-level assertions the
# integration tests below make read columns no operation of the broker
# reads, and those readers are compiled for a test build only.
antares-sql = { workspace = true, features = ["test-kit"] }

[features]
# The Pg arm is the only part of this crate that cannot cross to wasm32
# (sqlx needs sockets). Default-on everywhere else; the browser build turns
# it off and gets the memory store through the same seam. A feature gate
# only — every gated item keeps its behaviour verbatim.
default = ["postgres"]
postgres = ["dep:sqlx", "dep:metrics"]
# Row readers that exist for the integration tests in tests/ and for
# nothing else: the broker's own operations never call them, so a release
# build never compiles them.
test-kit = []

[lints]
workspace = true
