[package]
name = "antares-store"
description = "Storage driver traits + the backend-neutral store types (no backend dependencies)."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

[dependencies]
antares-model = { workspace = true }
antares-ql = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }

[features]
# The driver contract as a runnable function (`contract.rs`), for the
# backends in this workspace and for any driver built outside it. Off by
# default: nothing in a serving binary calls it.
test-kit = []

[dev-dependencies]
regex = { workspace = true }
# the driver seams are async, so their own tests need a runtime to drive
tokio = { workspace = true }

[lints]
workspace = true
