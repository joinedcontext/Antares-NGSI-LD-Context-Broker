# Standalone crate: an empty [workspace] keeps it out of the broker's workspace,
# so the demo never perturbs the broker's dependency graph or build.
[workspace]

[package]
name = "wasm-kpi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
