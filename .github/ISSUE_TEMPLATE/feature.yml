name: Feature request
description: New capability or deployment need
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What you are deploying/building and what is missing.
    validations: {required: true}
  - type: textarea
    id: spec
    attributes:
      label: Spec relationship
      description: Is this CIM 009 behaviour (cite the clause), an extension, or tooling?
