name: Bug report
description: Broker misbehaviour with a reproduction
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Broker version
      description: "`antares --version` or the image tag (e.g. :dev-1234)"
    validations: {required: true}
  - type: dropdown
    id: store
    attributes:
      label: Store mode
      options: [memory, file, postgres, timescale, wasm (browser/shim)]
    validations: {required: true}
  - type: input
    id: bus
    attributes:
      label: Bus / topology
      placeholder: "local single node | nats role-split fleet | ..."
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The request(s) — method, path, headers, payload — and relevant config. curl preferred.
      render: bash
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: Include status codes and bodies.
    validations: {required: true}
