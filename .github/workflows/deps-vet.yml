name: deps-vet

# One look to approve a dependency update. For every version a pull
# request moves (lockfiles, action tags, base and service images, new
# transitive packages included) dev/deps-vet.py checks that it was
# published at least 7 days ago, that no advisory (OSV, cargo-deny, npm
# audit) names it, and that nothing in it looks like a supply-chain change
# (a new build script or install script, another publisher, provenance or
# trusted publishing dropped, a checksum that is not the registry's). The
# job summary is one table; any failing row turns the check red and names
# the reason. Dependabot's pull requests and people's go through it alike.
#
# pull_request, never pull_request_target: the job runs with a read-only
# token and no secrets, so a pull request that edits this file or the
# script gains nothing. The script itself is taken from the base branch,
# so a pull request cannot loosen the rules it is judged by; only the pull
# request that first adds the script runs its own copy, and says so.
on:
  pull_request:
    branches: [dev]
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "Dockerfile*"
      - "**/Dockerfile*"
      - "**/*compose*.yml"
      - "**/*compose*.yaml"
      - "deploy/**"
      - deny.toml
      - dev/deps-vet.py

permissions:
  contents: read

concurrency:
  group: deps-vet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vet:
    name: Dependency vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # the merge base and the base branch's copy of the script
          fetch-depth: 0
          persist-credentials: false
      # Pinned like the same download in workspace.yml (ADR-0018); the
      # advisory database is fetched by the tool at run time.
      - name: cargo-deny
        run: |
          V=0.20.2
          mkdir -p "$HOME/.cargo/bin"
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${V}/cargo-deny-${V}-$(uname -m)-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.cargo/bin" --strip-components=1 --wildcards '*/cargo-deny'
      - name: Vet the changed dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The job's own token, read-only here: it only lifts the GitHub
          # API rate limit for the action-tag lookups.
          GITHUB_TOKEN: ${{ github.token }}
          # cargo-deny runs `cargo metadata`; stable from rustup, not a
          # toolchain the pull request's rust-toolchain.toml names.
          RUSTUP_TOOLCHAIN: stable
        run: |
          mkdir -p vet && touch vet/summary.md
          script="$RUNNER_TEMP/deps-vet.py"
          if git show "origin/${BASE_REF}:dev/deps-vet.py" > "$script" 2>/dev/null; then
            origin="the base branch (origin/${BASE_REF})"
          else
            cp dev/deps-vet.py "$script"
            origin="this pull request (the base branch has no copy yet)"
          fi
          set +e
          python3 -I "$script" check --base "$BASE_SHA" --head "$HEAD_SHA" --tree . \
            --cargo-deny "$HOME/.cargo/bin/cargo-deny" --npm npm \
            --summary vet/summary.md --json vet/rows.json
          rc=$?
          set -e
          printf "\nRules from dev/deps-vet.py of %s.\n" "$origin" >> vet/summary.md
          cat vet/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      # The table, for deps-vet-comment.yml to post on the pull request; it
      # reads this artifact as text and never runs anything from it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deps-vet
          path: vet/
          if-no-files-found: ignore
          retention-days: 7
