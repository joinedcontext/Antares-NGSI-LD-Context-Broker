name: fuzz

# Scheduled fuzzing of the user-input interpreters —
# the q= grammar, scopeQ evaluation, geoQ params, and the JSON-LD expansion
# input path. Any crash/panic fails the job and uploads the artifact input.
# Found a crash? Commit the input to fuzz/regressions/<target>/ with the
# fix — strict.yml replays that corpus daily so it can never regress.
# A crash also auto-files a security-labeled issue (per target, deduped) —
# a red twice-a-week run must not sit unnoticed. A target that fails to
# build alarms too, under its own title: it is not a crash, and a security
# issue naming an artifact that was never written is one nobody can act on.
on:
  schedule:
    - cron: "17 3 * * 1,4" # twice a week, Mon + Thu 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the crash alarm

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [parse_q, scope_q, geo_params, expand_entity]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
      - name: A crash leaves its input behind
        # `cargo fuzz run` builds and runs under one command, so a target that
        # fails to compile exits exactly like one that crashed. Only a crash
        # writes an input under fuzz/artifacts/<target>: without one there is
        # no corpus entry to commit and nothing a security issue can point at,
        # so the two outcomes alarm separately.
        if: failure()
        id: outcome
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(ls -A "fuzz/artifacts/${{ matrix.target }}" 2>/dev/null)" ]; then
            echo "crash=true" >> "$GITHUB_OUTPUT"
          else
            echo "crash=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload crash artifacts
        if: steps.outcome.outputs.crash == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
      - name: File an issue on a crash
        # dispatch runs file too — a crash is a real bug worth tracking
        # either way, and the open issue dedupes repeats
        if: steps.outcome.outputs.crash == 'true'
        uses: ./.github/actions/failure-issue
        with:
          title: "Fuzz crash in ${{ matrix.target }}"
          label: security
          body: >-
            The fuzz run crashed the `${{ matrix.target }}` target. The crash
            input is uploaded as the `fuzz-artifacts-${{ matrix.target }}`
            artifact — commit it to `fuzz/regressions/${{ matrix.target }}/`
            with the fix so strict.yml's daily replay pins it.
      - name: File an issue when the target never ran
        if: failure() && steps.outcome.outputs.crash != 'true'
        uses: ./.github/actions/failure-issue
        with:
          title: "Fuzz target ${{ matrix.target }} did not run"
          body: >-
            The `${{ matrix.target }}` job went red without leaving a crash
            input, so the target did not build or the run never started. The
            job log names the step; nothing is fuzzed until it is fixed.
