name: pages

# Auto-redeploy of the Pages site after every FULL matrix run
# (retargeted with the quick/full preset split) —
# the README's seven per-cell ETSI badges and the /reports/ page always
# describe a full 7-cell run. Per-commit ci runs gate on the quick preset
# and upload ETSI-quick-results, which the fold deliberately ignores.
#
# This OVERTURNS the earlier "Pages deploys are manual-only" decision for
# the REPORTS half of the site. The playground half is REUSED from the
# newest antares-www artifact (produced by a wasm.yml run) — this workflow
# never rebuilds wasm; wasm.yml's manual dispatch keeps working and remains
# the only path that rebuilds/updates the playground itself.

on:
  workflow_run:
    # full.yml absorbed etsi-full — its twice-a-week schedule (and
    # dispatches) fire this. The schedule runs on the default branch, dev.
    # The branch filter matches the HEAD branch of the triggering run,
    # which a pull request from a fork can also name dev; the job
    # condition below therefore refuses pull_request runs outright, so a
    # fork can never repaint the public badges.
    workflows: [full]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  PAGES_DOMAIN: antares-ngsi-ld-demo.marek-mraz.com

jobs:
  publish:
    name: Fold reports + deploy Pages
    # Deploy on a RED full run too: the badges and report page must
    # turn red, not silently go stale on the last green numbers. Only
    # cancellation and skipping are non-events.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      issues: write # the deploy alarm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Reuse the newest playground bundle (antares-www)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p site
          art=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=antares-www&per_page=1" \
               -q '.artifacts[0] | "\(.id) \(.workflow_run.head_sha) \(.created_at)"' 2>/dev/null || true)
          id=${art%% *}
          if [ -n "$id" ] && [ "$id" != "null" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > www.zip
            unzip -q www.zip -d site
            # The bundle is the newest one in retention, which is not
            # necessarily this deploy's commit: the wasm build is dispatched,
            # not run per deploy. Say which commit it IS, so a visitor can
            # tell the playground apart from the docs beside it.
            set -- $art
            printf '{"commit":"%s","built":"%s"}\n' "$2" "$3" > site/playground-source.json
          else
            # no playground bundle in retention: reports still deploy; the
            # playground appears after the next wasm.yml dispatch
            echo '<!doctype html><title>Antares</title><p>Playground pending a wasm.yml run — <a href="reports/latest/">ETSI conformance report</a>.' \
              > site/index.html
          fi
          echo "$PAGES_DOMAIN" > site/CNAME

      - name: Build the docs book into the site
        run: |
          curl -sL https://github.com/rust-lang/mdBook/releases/download/v0.4.44/mdbook-v0.4.44-x86_64-unknown-linux-musl.tar.gz | tar xz
          ./mdbook build -d site/docs

      # The vendored ETSI OpenAPI and the broker's own operational API,
      # each rendered with ReDoc (the CIM 047 Annex B recommendation) as a
      # standalone page next to the book.
      - name: Render the API specs with ReDoc
        # fail-soft: a renderer hiccup must not take the whole report deploy
        # down with it — the page then says so instead of 404ing
        run: |
          for pair in "ngsi-ld-api:api:NGSI-LD API" "antares-admin:admin-api:Antares operational API"; do
            IFS=: read -r src page title <<< "$pair"
            npx --yes @redocly/cli@2.49.0 build-docs "docs/openapi/$src.yaml" -o "site/docs/$page.html" \
              || echo "<!doctype html><title>$title</title><p>ReDoc render failed this deploy — see docs/openapi/$src.yaml in the repo." > "site/docs/$page.html"
          done

      # API reference beside the book: book at /docs, rustdoc at /api.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: pages-rustdoc
      - name: Build rustdoc into the site
        run: |
          cargo doc --no-deps --workspace --locked
          cp -r target/doc site/api
          # rustdoc has no workspace root page, so /api/ 404s without one
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=antares_api/"><title>Antares crates</title>' > site/api/index.html

      - name: Fold the latest ETSI report + coverage into the site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ./dev/fold-reports.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: File an issue on a failed auto-deploy
        # a broken auto-deploy means the public report goes silently stale
        if: failure() && github.event_name == 'workflow_run'
        uses: ./.github/actions/failure-issue
        with:
          title: Pages report deploy failed
          body: >-
            The automatic Pages redeploy after a full matrix run went red —
            the /reports/ page and badges are now stale. Rerun via dispatch
            once fixed.
