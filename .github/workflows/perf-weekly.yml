name: perf-weekly

# Weekly benchmark on dedicated hardware. Shared GitHub runners swing
# 20-30% run to run, so nothing measured there is a number; this rents one
# Hetzner dedicated-vCPU machine, registers it as an ephemeral self-hosted
# runner, benchmarks, and deletes it. perf-janitor.yml sweeps leaks.
#
# Report-only by design: NO regression gate exists until the noise profile
# (repeated same-commit passes on this exact instance type) has been
# measured and published — a threshold picked before the variance is known
# is a guess. The gate shape to adopt then: per-benchmark IQR fencing
# against its own history (fail above Q3 + 3*IQR), plus significance AND a
# separate noise threshold for micro-benchmarks.
#
# The instance type is pinned. CX/CPX/CAX share CPU between co-tenants
# with burst credits; CCX gives one vCPU = one physical thread (L3, memory
# bandwidth, network and disk remain shared). Changing the type
# invalidates the entire recorded history — treat a change as a history
# reset, never a tweak.
#
# Secrets: HCLOUD_TOKEN (Hetzner project API token), RUNNER_PAT (repo-admin
# PAT for the runner registration token).

on:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:
    inputs:
      repeats:
        description: benchmark passes (>=10 for a noise-profile run)
        default: "10"
      store:
        description: memory, or postgres (adds the same tables against a PostgreSQL container on the box, at pool 20 and 100)
        default: memory
      server:
        description: Hetzner instance type. ccx33 is the pinned one every published number comes from; ccx53 doubles the physical cores so core-scale.sh can run its 4- and 8-core steps, and its numbers belong to their own history
        default: ccx33

env:
  SERVER_TYPE: ${{ inputs.server || 'ccx33' }}
  SERVER_IMAGE: ubuntu-24.04
  SERVER_LOCATION: hel1
  TTL_HOURS: 1

# The Hetzner credentials are the sensitive part of this run; the
# GITHUB_TOKEN itself only has to read the checkout.
permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.mk.outputs.label }}
      server_id: ${{ steps.mk.outputs.server_id }}
    steps:
      - name: Create server + register ephemeral runner
        id: mk
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          RUNNER_PAT: ${{ secrets.RUNNER_PAT }}
        run: |
          LABEL="perf-${{ github.run_id }}"
          REG=$(curl -sf -X POST -H "Authorization: Bearer $RUNNER_PAT" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token" \
            | jq -r .token)
          # Nothing is rented before the registration token is in hand: an
          # empty one still produces a machine, and a machine whose runner
          # never registers is an hour of rent and a job queued against a
          # label that will never appear.
          [ -n "$REG" ] && [ "$REG" != null ] || { echo "no runner registration token"; exit 1; }
          EXPIRY=$(( $(date +%s) + TTL_HOURS * 3600 ))
          USERDATA=$(cat <<EOF
          #cloud-config
          package_update: true
          packages: [jq, build-essential, docker.io]
          runcmd:
            - |
              mkdir -p /opt/runner && cd /opt/runner
              curl -sL https://github.com/actions/runner/releases/download/v2.337.0/actions-runner-linux-x64-2.337.0.tar.gz | tar xz
              export RUNNER_ALLOW_RUNASROOT=1
              ./config.sh --url https://github.com/${{ github.repository }} \
                --token $REG --ephemeral --unattended --no-default-labels --labels $LABEL --name $LABEL
              nohup ./run.sh >/var/log/runner.log 2>&1 &
          EOF
          )
          RESP=$(jq -n --arg name "$LABEL" --arg type "$SERVER_TYPE" \
            --arg image "$SERVER_IMAGE" --arg loc "$SERVER_LOCATION" \
            --arg ud "$USERDATA" --arg exp "$EXPIRY" \
            '{name:$name, server_type:$type, image:$image, location:$loc,
              user_data:$ud,
              labels:{role:"perf-runner", expiry:$exp}}' \
            | curl -sS --fail-with-body -X POST -H "Authorization: Bearer $HCLOUD_TOKEN" \
              -H "Content-Type: application/json" -d @- \
              https://api.hetzner.cloud/v1/servers) || { echo "server refused: $RESP"; exit 1; }
          SERVER_ID=$(echo "$RESP" | jq -r .server.id)
          [ -n "$SERVER_ID" ] && [ "$SERVER_ID" != null ] || { echo "server id missing: $RESP"; exit 1; }
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "server_id=$SERVER_ID" >> "$GITHUB_OUTPUT"
          # Expected cost for this run, from the price list, at the TTL cap.
          PRICE=$(curl -sf -H "Authorization: Bearer $HCLOUD_TOKEN" \
            https://api.hetzner.cloud/v1/server_types \
            | jq -r ".server_types[] | select(.name==\"$SERVER_TYPE\") | .prices[] | select(.location==\"$SERVER_LOCATION\") | .price_hourly.gross")
          echo "cost cap: $SERVER_TYPE at $PRICE/h x ${TTL_HOURS}h" >> "$GITHUB_STEP_SUMMARY"

  bench:
    needs: create
    runs-on: ${{ needs.create.outputs.label }}
    timeout-minutes: 55
    env:
      # the allocator settings the image ships (Dockerfile)
      MALLOC_CONF: background_thread:true,narenas:4,dirty_decay_ms:10000,muzzy_decay_ms:10000
      _RJEM_MALLOC_CONF: background_thread:true,narenas:4,dirty_decay_ms:10000,muzzy_decay_ms:10000
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
            | tar xz --strip-components=1
          sudo mv k6 /usr/local/bin/ 2>/dev/null || mv k6 /usr/local/bin/
      # The subscription index carries a capacity target (100 000
      # subscriptions per broker), and its shape gate is a release-mode
      # timing assertion: it belongs on dedicated hardware, where the numbers
      # measure the index rather than the neighbours on a shared runner.
      - name: Subscription index shape
        run: cargo test --release -q -p antares-api --test sub_index -- --ignored --nocapture
      - name: Benchmark passes
        run: REPEATS=${{ inputs.repeats || 10 }} DURATION=1m ./dev/perf/run-bench.sh
      # The published shapes (memory store, this box): startup, throughput
      # at fixed concurrency, core scaling, saturation knee. The postgres
      # rows of the same tables come from scale-weekly, which owns a database.
      - name: Startup time and idle footprint
        run: ./dev/perf/startup.sh
      - name: Throughput per request shape
        run: ./dev/perf/shapes.sh
      - name: Core scaling
        run: ./dev/perf/core-scale.sh
      # The write shape as well: the in-process store holds one writer lock,
      # so the query ladder above cannot say whether that lock is what the
      # eighth core is spent on. Both stores, because the file store's
      # committer is a second candidate for the same symptom.
      - name: Core scaling, write shape
        run: |
          SHAPE=update ./dev/perf/core-scale.sh
          STORE=file OUT=results/perf/file SHAPE=update ./dev/perf/core-scale.sh
      - name: Saturation sweep
        run: STAGES=10 STAGE=15s ./dev/perf/saturate.sh
      # The same tables with the store out of process: PostgreSQL on this
      # box, one fresh database per pool size so a write sweep never feeds
      # the next read, and the closed-loop rows at 64, 256 and 1 024
      # clients, where the connection cap and the pool meet.
      - name: PostgreSQL
        if: inputs.store == 'postgres'
        run: |
          docker run -d --name pg --network host \
            -e POSTGRES_USER=antares -e POSTGRES_PASSWORD=antares -e POSTGRES_DB=antares \
            --shm-size=2g ghcr.io/baosystems/postgis:17-3.5 \
            -c shared_buffers=4GB -c work_mem=64MB -c synchronous_commit=off -c max_connections=300
          until docker exec pg pg_isready -q; do sleep 1; done
      - name: Core scaling, shapes and saturation on PostgreSQL, pool 20 and 100
        if: inputs.store == 'postgres'
        run: |
          for POOL in 20 100; do
            docker exec pg psql -q -U antares -c "CREATE DATABASE pool$POOL"
            export DATABASE_URL="postgres://antares:antares@127.0.0.1:5432/pool$POOL"
            export ANTARES_DATABASE_URL="$DATABASE_URL" ANTARES_PG_POOL=$POOL ANTARES_ALLOW_SHARED_LOCAL=1
            export STORE=postgres OUT="results/perf/pg-pool$POOL"
            DURATION=30s ./dev/perf/core-scale.sh
            SPECS="query 64,query 256,query 1024,retrieve 64,retrieve 256,retrieve 1024" ./dev/perf/shapes.sh
            STAGES=10 STAGE=15s ./dev/perf/saturate.sh
          done
      - name: Fold the tables into one report
        if: always()
        run: python3 dev/perf/report.py results/perf
      - name: Summary
        if: always()
        run: |
          {
            echo "## Weekly perf (${{ env.SERVER_TYPE }})"
            echo '```'
            cat results/perf/run-metadata.txt
            [ -f results/perf/noise-profile.txt ] && cat results/perf/noise-profile.txt
            echo '```'
            python3 dev/perf/report.py results/perf --readme
            for f in results/perf/core-scale-update.md results/perf/file/core-scale-update.md; do
              [ -f "$f" ] || continue
              echo; echo "## Core scaling, write shape (${f%/core-scale-update.md})"; echo; cat "$f"
            done
            for d in results/perf/pg-pool*; do
              [ -d "$d" ] || continue
              echo "## PostgreSQL, ${d##*/pg-}"
              for f in core-scale shapes saturate; do echo; cat "$d/$f.md" 2>/dev/null; done
            done
          } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-weekly-results
          path: results/perf
          retention-days: 90

  delete:
    needs: [create, bench]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete the runner server
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          ID="${{ needs.create.outputs.server_id }}"
          [ -n "$ID" ] && [ "$ID" != "null" ] || exit 0
          curl -sf -X DELETE -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/servers/$ID" || true
