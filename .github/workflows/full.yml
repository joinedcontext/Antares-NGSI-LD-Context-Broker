name: full

# The EVERYTHING pipeline — twice a week on schedule and on manual
# dispatch; a dispatch with `release` set IS the release (see below; ci.yml's
# quick preset gates dev itself): workspace tests, the
# browser/wasm artifact proven in both runtimes, the wasm Node tier, and
# the reusable cell matrix at the FULL preset (all seven cells — memory/file/postgres/timescale, both
# rolling -nats fleets, wasm-file — each serial-all-suites against one
# stack; the former etsi-serial job duplicated this and was removed).
#
# etsi-full.yml was folded in HERE: it duplicated this exact
# workspace→matrix graph on a 3-day cron. The schedule (now 2×/week) and
# pages.yml listens to
# THIS workflow, so the README badges + /reports/ page always render a full
# 7-cell run (per-commit quick bundles are named ETSI-quick-results and
# never folded).
#
# Releasing: Actions → full → Run workflow on dev with `release` = 0.MINOR.PATCH.
# The grid runs once on that commit; only when all of it is green does the
# run tag v<release> on the tested commit, publish the image (:<version> +
# :<minor> + :latest), binaries, wasm bundle and SBOM from the bytes it
# tested, and move main to the release. A red run creates no tag, so the
# same version is simply run again after the fix. Schedule and plain
# dispatch runs publish only the ETSI-proven wasm dev image (the native
# :dev ships per-commit from ci.yml).
# Moved out: the roll-under-suite drill lives in roll-weekly.yml
# (weekly + dispatch), the k8s manifest smoke in k8s-smoke.yml (dispatch).

on:
  schedule:
    # Wed + Sat 03:23 UTC — the twice-a-week full proof, offset from
    # strict's daily 02:41, fuzz's Mon+Thu 03:17 and roll-weekly's Tue 04:17.
    - cron: "23 3 * * 3,6"
  workflow_dispatch:
    inputs:
      release:
        description: "Release version, e.g. 0.2.1 (must equal the Cargo.toml workspace version). Empty: test run, nothing published."
        type: string
        default: ""

# The default for every job here; the ones that publish an image, cut a
# release or file an issue declare their own wider set.
permissions:
  contents: read

# A release run is never cancelled, and a schedule on dev never cancels it.
concurrency:
  group: full-${{ github.ref }}-${{ inputs.release || 'test' }}
  cancel-in-progress: ${{ !inputs.release }}

env:
  MEM_LIMIT_MB: 350
  # 0.2.1 and v0.2.1 for a release run, empty otherwise
  RELEASE: ${{ inputs.release }}
  TAG: ${{ inputs.release && format('v{0}', inputs.release) || '' }}

jobs:
  source:
    # The release rules, held before a runner is spent on the grid: a
    # release runs on dev, carries the workspace version and names a tag
    # that does not exist yet. Every other run passes.
    name: Source of the change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: dev/check-source.sh --self-test && dev/check-source.sh

  workspace:
    # The shared workspace-test gate (workflow_call) — one definition for
    # ci and full, see .github/workflows/workspace.yml.
    name: Workspace tests
    needs: source
    uses: ./.github/workflows/workspace.yml

  wasm:
    # The browser artifact. Build (size budget enforced by the script),
    # then prove it in BOTH runtimes (dev/wasm-test.sh): the
    # Node shim does a create + a real-HTTP notification; headless Chromium
    # runs the React playground — OPFS worker broker, entity, subscription,
    # in-page notification, second tab, federation. The same scripts a
    # local run uses.
    name: Browser build (wasm32)
    # GATE: builds start only after the workspace suite is green (the same
    # workspace -> builds -> matrix graph as ci.yml / etsi-full.yml).
    needs: workspace
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.release }}
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: wasm-bindgen (lockfile-matched) + binaryen
        run: |
          ./dev/install-wasm-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build + size budget
        run: |
          ./dev/wasm-build.sh | tee wasm-size.txt
          echo "## Browser artifact" >> "$GITHUB_STEP_SUMMARY"
          tail -1 wasm-size.txt >> "$GITHUB_STEP_SUMMARY"
      - name: React playground — deps, test, build (www)
        working-directory: www
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          npx vitest run
          npm run build
      - name: Node tier smoke + browser tier
        run: ./dev/wasm-test.sh
      # NO bundle upload here: the run's ONE antares-wasm-pkg artifact comes
      # from the matrix's build-wasm job — the bytes the wasm-file cell
      # ETSI-tested — and that is what the release ships.
      # (Uploading a second bundle under the same name would collide: v4+
      # artifacts are immutable.)

  matrix:
    # The reusable cell matrix at the FULL preset (default): all seven cells
    # — memory/file/postgres/timescale, both rolling -nats fleets, wasm-file
    # — each running every suite serially against one stack with the
    # between-suite reset.
    name: ETSI cell matrix
    # GATE: same graph as ci.yml — no image build / ETSI run on a red
    # workspace suite.
    needs: workspace
    uses: ./.github/workflows/etsi-matrix.yml
    permissions:
      contents: read
      actions: write # the summary job deletes the merged per-cell artifacts

  # etsi-serial was REMOVED: it duplicated the matrix exactly.
  # Its comment claimed the matrix cells got a fresh stack per suite — true
  # in the 32-cell era, stale since the matrix became all-suites-per-cell:
  # every cell now runs the suites IN ORDER against ONE stack with the
  # between-suite reset, which is precisely what serial proved.

  etsi-wasm:
    # The Node tier — the serial ETSI suites against the BROWSER
    # artifact: five node shims serving the same .wasm a page loads
    # (WASM=1 in the one pipeline). MQTT stays excluded (no MQTT sink in a
    # browser build) and there is no RSS gate (the wasm size budget is the
    # artifact's own gate). Cadence: this workflow's — twice a week, tags,
    # manual.
    name: wasm Node tier (serial suites)
    needs: [workspace, wasm]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.release }}
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: wasm toolchain
        run: |
          ./dev/install-wasm-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Serial suites against the wasm shims
        env:
          WASM: "1"
          STORE: memory
          STOP_ON_ERROR: "0"
          CALLBACK_HOST: localhost
          RESULTS_DIR: results/wasm-node
        run: ./dev/etsi-pipeline.sh || true
      - name: Upload wasm-tier results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ETSI-wasm-node
          path: |
            results/wasm-node/run-summary.md
            results/wasm-node/gate-status.txt
            results/wasm-node/failures.csv
            results/wasm-node/**/log.html
            results/wasm-node/**/report.html
          retention-days: 14
      - name: Gate — the wasm Node tier is green
        run: |
          gate=$(cat results/wasm-node/gate-status.txt 2>/dev/null || echo MISSING)
          echo "wasm Node tier gate = $gate"
          cat results/wasm-node/run-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ "$gate" = PASS ]

  alarm:
    # A red scheduled matrix must not wait for someone to notice the badge:
    # file a deduped issue (shared failure-issue action). Tag and dispatch
    # runs are watched by whoever started them.
    name: File an issue on a red scheduled run
    if: failure() && github.event_name == 'schedule'
    needs: [workspace, wasm, matrix, etsi-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/failure-issue
        with:
          title: full matrix scheduled run failed
          body: >-
            The twice-a-week full run went red — workspace tests, a matrix
            cell, or a wasm tier. The Pages report and badges will show the
            red cells; the run's ETSI-matrix-results bundle has every
            failure with expected-vs-got.

  build-arm:
    # The arm64 half of the released manifest — BUILT, never tested; the
    # rationale lives in the shared build-image.yml. Release runs only.
    name: Build the arm64 image (untested)
    if: inputs.release != ''
    uses: ./.github/workflows/build-image.yml
    with:
      arch: arm64

  tag:
    # The release exists from here on: every gate and every artifact of
    # this run is green, so the tag names exactly the commit they tested.
    # It is final (protect-tags), which is why nothing creates it earlier.
    # A tag pushed with GITHUB_TOKEN starts no workflow, so the examples
    # run that used to follow a tag push is dispatched here.
    name: Tag the release
    if: inputs.release != '' && success()
    needs: [source, workspace, wasm, matrix, etsi-wasm, upgrade-path, release-binaries, build-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh workflow run examples.yml --ref "$TAG"
          echo "Tagged $TAG on ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    # A release run is the only thing that mints a production image, and it
    # needs the full cell matrix green (each cell is serial-all-suites).
    # The roll drill (roll-weekly.yml) and k8s smoke (k8s-smoke.yml) run on
    # their own cadence and no longer gate the release.
    name: Publish the release image to GHCR
    if: inputs.release != '' && success()
    # The binaries and the browser proof are in the set on purpose: the
    # image and :latest move only when the whole release can ship, so a red
    # binary never leaves a version on the registry that has no release.
    needs: [tag, matrix, build-arm, release-binaries, wasm]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v8
        with:
          name: antares-image

      - name: Download the arm64 image
        uses: actions/download-artifact@v8
        with:
          name: antares-image-arm64

      - name: Push amd64 (the EXACT image both gates tested) + arm64, stitch the manifest
        env:
          # through the environment, never spliced into the script text:
          # `${{ }}` is substituted before the shell parses the line
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load < antares-image.tgz
          docker load < antares-image-arm64.tgz
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/antares-broker
          # Image tags carry the bare version (the git tag is v0.1.1, the
          # image is :0.1.1, as registries name images), plus the minor
          # (:0.1 follows the newest patch) and :latest.
          VER="$RELEASE"
          MINOR="${VER%.*}"
          SHA=${GITHUB_SHA::7}
          docker tag antares-local:latest "$IMG:$SHA-amd64"
          docker tag antares-local:arm64 "$IMG:$SHA-arm64"
          docker push "$IMG:$SHA-amd64"
          docker push "$IMG:$SHA-arm64"
          docker buildx imagetools create \
            -t "$IMG:$VER" -t "$IMG:$MINOR" -t "$IMG:$SHA" -t "$IMG:latest" \
            "$IMG:$SHA-amd64" "$IMG:$SHA-arm64"
          echo -e "\n## Released: \`$IMG:$VER\` + \`$IMG:$MINOR\` + \`$IMG:latest\` (multi-arch amd64+arm64; amd64 = the tested bytes, matrix + serial, all four store modes green)" >> "$GITHUB_STEP_SUMMARY"

  upgrade-path:
    # Data written by the PREVIOUS release must be served by this one. The
    # binaries are built from the two commits and pointed at one store in
    # turn, so the proof is the real artifact pair rather than a migration
    # read by eye. Nothing to prove on the FIRST tag: there is no N-1.
    name: Upgrade path from the previous release
    if: inputs.release != ''
    needs: workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous tag has to be reachable
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve the previous release tag
        id: prev
        run: |
          VER="$TAG"
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^$VER$" | head -1)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"
          if [ -z "$PREV" ]; then
            echo "No previous v* tag: $VER is the first release, nothing to upgrade from." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build this release
        if: steps.prev.outputs.tag != ''
        run: |
          cargo build --locked --release -p antares-broker
          cp "$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')/release/antares" \
            "$RUNNER_TEMP/antares-new"
      - name: Build the previous release
        if: steps.prev.outputs.tag != ''
        run: |
          git worktree add "$RUNNER_TEMP/prev" "${{ steps.prev.outputs.tag }}"
          cd "$RUNNER_TEMP/prev"
          cargo build --locked --release -p antares-broker
          cp "$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')/release/antares" \
            "$RUNNER_TEMP/antares-old"
      - name: Serve the previous release's data (file + postgres)
        if: steps.prev.outputs.tag != ''
        env:
          ANTARES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          ./dev/upgrade-path.sh "$RUNNER_TEMP/antares-old" "$RUNNER_TEMP/antares-new"
          echo "Upgrade path from ${{ steps.prev.outputs.tag }}: file + postgres green." \
            >> "$GITHUB_STEP_SUMMARY"

  release-binaries:
    # Static musl binaries per arch — release assets.
    name: Release binary (${{ matrix.target }})
    if: inputs.release != ''
    needs: workspace
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get install -y -q musl-tools
      # The released binary runs the core alone. Checked HERE and not only
      # in the test gate, because this is where the artifact people download
      # is produced.
      - name: No addon in the shipped build
        run: ./dev/check-no-addon.sh
      - name: Build + package
        env:
          # musl-tools' aarch64-linux-musl-gcc wraps the glibc gcc, whose
          # default -moutline-atomics links libgcc's lse-init.o, and that
          # needs glibc's __getauxval. Every atomics probe of jemalloc's
          # configure then fails to link and the build stops at "Don't have
          # atomics implemented on this platform". Inline atomics need no
          # helper. The variable names the target, so the x86_64 leg ignores it.
          CFLAGS_aarch64_unknown_linux_musl: -mno-outline-atomics
        run: |
          # --locked: the released binary and the released image must be built
          # from the same dependency set (the Dockerfile builds locked too).
          cargo build --locked --release --target ${{ matrix.target }} -p antares-broker
          strip "target/${{ matrix.target }}/release/antares"
          VER="$TAG"
          tar czf "antares-$VER-${{ matrix.target }}.tar.gz"             -C "target/${{ matrix.target }}/release" antares             -C "$GITHUB_WORKSPACE" LICENSE README.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-bin-${{ matrix.target }}
          path: antares-*.tar.gz

  github-release:
    # The GitHub Release — gated on the SAME green the image needed,
    # with binaries, the wasm bundle, an SBOM, and a signed image.
    name: GitHub Release (assets + SBOM + signature)
    if: inputs.release != '' && success()
    needs: [publish-release, release-binaries, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@v7
      - name: The image tag is the bare version
        id: image
        run: echo "tag=$RELEASE" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-bin-*
          merge-multiple: true
      # the matrix's build-wasm bundle — the ETSI-tested bytes
      - uses: actions/download-artifact@v8
        with:
          name: antares-wasm-pkg
          path: wasm-pkg
      - name: Zip the wasm bundle
        run: |
          VER="$TAG"
          (cd wasm-pkg && zip -qr "../antares-wasm-$VER.zip" .)
      - name: SBOM (syft, spdx-json) of the released image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/antares-broker:${{ steps.image.outputs.tag }}
          format: spdx-json
          output-file: antares-${{ env.TAG }}.sbom.spdx.json
          upload-artifact: false
      - name: Sign the image (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/antares-broker:${{ steps.image.outputs.tag }}"
      - name: Release notes from the commit log
        run: |
          VER="$TAG"
          git fetch -q --tags --force --unshallow 2>/dev/null || git fetch -q --tags --force
          # the newest other release by version, not `git describe`: tags up
          # to v0.2.0 sit on main's merge commits, which dev never reaches
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^$VER$" | head -1)
          git log --no-merges --format='- %s' ${PREV:+$PREV..}"$VER" > notes.md
          [ -s notes.md ] || echo "Antares $VER." > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$TAG"
          gh release create "$VER"             --title "Antares $VER" --notes-file notes.md             antares-*.tar.gz "antares-wasm-$VER.zip" "antares-$VER.sbom.spdx.json"

  main:
    # main is the latest release: a merge commit of the released commit on
    # top of the previous release, pushed by this job (the protect-main
    # ruleset lets GitHub Actions, and nobody else, update it). The docs
    # link tree/main for the reference manifests and ADRs of the release.
    name: Move main to the release
    if: inputs.release != '' && success()
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          git fetch -q origin "$GITHUB_SHA"
          git merge --no-ff -X theirs -m "Release $TAG" "$GITHUB_SHA"
          git diff --quiet "$GITHUB_SHA" HEAD || { echo "::error::main's tree differs from the release"; exit 1; }
          git push origin HEAD:main
