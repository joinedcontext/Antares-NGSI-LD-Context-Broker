name: wasm

# Manual CI/CD for the browser build ALONE — the same build + test steps as
# full.yml's wasm job (dev/wasm-build.sh size budget, dev/wasm-test.sh Node
# tier + headless-Chromium tier incl. the cross-tenant federation check)
# without dragging the ETSI matrix along, PLUS the React playground
# (www: vitest + vite build, served at /; the old /app/ path redirects
# to /). Publishes the
# ready-to-serve bundle as an artifact; `deploy_pages: true` additionally
# deploys it to GitHub Pages (requires Pages enabled with "GitHub Actions"
# source) under the custom domain below.
#
# Custom domain (PAGES_DOMAIN): the CNAME file in the artifact pins it per
# deploy. One-time setup outside this file: a DNS CNAME record
#   antares-ngsi-ld-demo  →  joinedcontext.github.io
# and repo Settings → Pages → Custom domain + Enforce HTTPS.

on:
  # Manual only (standing decision): no push trigger. Deploying the
  # playground is always an explicit `Run workflow` with deploy_pages ticked —
  # so remember the live site trails dev until someone dispatches this.
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy the playground to GitHub Pages after a green run"
        type: boolean
        default: false

# The default for the build; the Pages deploy declares its own wider set.
permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_DOMAIN: antares-ngsi-ld-demo.marek-mraz.com

jobs:
  build-test:
    name: Build + test (wasm32)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen (lockfile-matched) + binaryen
        run: |
          ./dev/install-wasm-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build + size budget
        run: |
          ./dev/wasm-build.sh | tee wasm-size.txt
          echo "## Browser artifact" >> "$GITHUB_STEP_SUMMARY"
          tail -1 wasm-size.txt >> "$GITHUB_STEP_SUMMARY"
      # One frontend folder: deps + chromium, vitest, then the production
      # build. `npm run build` syncs pkg/worker/loopback into public/ first,
      # so this must run AFTER dev/wasm-build.sh — and BEFORE dev/wasm-test.sh,
      # whose browser tier drives the built www/dist. (The playwright e2e is
      # local-dev tooling — the auto-demo makes it minutes-long; vitest gates
      # CI.)
      - name: React playground — deps, test, build (www)
        working-directory: www
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          npx vitest run
          npm run build
      - name: Node tier + browser tier (incl. cross-tenant federation)
        run: ./dev/wasm-test.sh
      - name: Bundle the site (React app at /; vanilla page no longer deployed)
        run: |
          mkdir -p site
          cp -r www/dist/* site/
          # returning visitors of the old vanilla page still have its broker
          # service worker registered at root scope — replace it with a
          # self-destructing one so it unregisters on their next visit
          cat > site/sw.js <<'EOF'
          self.addEventListener("install", () => self.skipWaiting());
          self.addEventListener("activate", (e) => e.waitUntil(self.registration.unregister()));
          EOF
          # old /app/ links redirect to the root
          mkdir -p site/app
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=../"><a href="../">moved to /</a>' > site/app/index.html
          # custom domain: the CNAME file travels with every deploy
          echo "$PAGES_DOMAIN" > site/CNAME
      - name: Fold the latest ETSI conformance report into the site
        # The ONE Pages deployment carries the
        # playground AND /reports/ — the newest ETSI-matrix-results bundle is
        # rendered to a static page + shields badges (combined + per-cell).
        # The fold lives in dev/fold-reports.sh, SHARED with pages.yml
        # so the two Pages paths cannot drift; a missing
        # bundle renders a placeholder instead of failing the site deploy.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ./dev/fold-reports.sh
      - uses: actions/upload-artifact@v6
        with:
          name: antares-www
          path: site
      - name: Upload Pages artifact
        if: inputs.deploy_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: inputs.deploy_pages
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
