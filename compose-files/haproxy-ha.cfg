# The LB in front of the two antares1 replicas (docker-compose-ha.yml).
#
# Fast ejection is the load-bearing setting: the graceful drain gives the LB a
# 500 ms notice window (health goes 503 while the socket still works), so the
# check interval × fall count must fit inside it — 200 ms × 2 = 400 ms worst
# case from SIGTERM to ejection, inside the window with margin.

global
    maxconn 4096
    # The ETSI ContextSource keywords read the Location response header
    # CASE-SENSITIVELY (python dict, not requests' CaseInsensitiveDict).
    # The broker emits title-case "Location"; haproxy's HTX normalizes header
    # names to lowercase on the way out, which turned every "create without
    # id" TP into an orphaned-resource cascade — 12 of the 15 failed.
    # Restore the case so the LB is transparent: headers are
    # case-insensitive per RFC 9110, this only preserves what the broker sent.
    h1-case-adjust location Location

defaults
    mode http
    option h1-case-adjust-bogus-client
    timeout connect 2s
    # The ETSI suite holds subscriptions open across slow TPs; generous
    # server/client timeouts keep the LB from manufacturing failures.
    timeout client 60s
    timeout server 60s
    # A request that dies because its backend went down mid-flight gets one
    # retry on the other replica — idempotent-safe because redispatch only
    # applies to requests that never reached a backend (conn failures).
    retries 1
    option redispatch

frontend ngsi_ld
    bind :9090
    default_backend brokers

backend brokers
    option httpchk GET /q/health
    # 503 (DRAINING) fails the check by default — exactly the drain handshake.
    server antares1  127.0.0.1:9095 check inter 200ms fall 2 rise 2
    server antares1b 127.0.0.1:9096 check inter 200ms fall 2 rise 2
